name: Robôs mineradores

on:
  schedule:
    - cron: "7 2,8,14,20 * * *"   # vitrine (demonstração): 4x por dia
    - cron: "37 11,23 * * *"      # conta do dono: 2x por dia
  workflow_dispatch:
    inputs:
      conta: { description: "demo ou owner", default: "demo" }

concurrency: { group: robos, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  minerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Minerar
        env: { ROBOT_KEY: "${{ secrets.ROBOT_KEY }}", PYTHONUNBUFFERED: "1" }
        run: |
          CONTA="${{ github.event.inputs.conta }}"
          [ -z "$CONTA" ] && { [ "${{ github.event.schedule }}" = "37 11,23 * * *" ] && CONTA=owner || CONTA=demo; }
          python robo/minerar.py --conta "$CONTA" --buscas 20 --paginas 15 --funis 12 --minutos 18
      - name: Manter os agendamentos ativos (GitHub pausa repositório sem commits por 60 dias)
        run: |
          date -u +%Y-%m-%dT%H:%MZ > ultimo-run.txt
          git config user.name "oracle-robos"; git config user.email "robos@users.noreply.github.com"
          git add ultimo-run.txt && git commit -qm "robôs: $(date -u +%F)" && git push -q || true
